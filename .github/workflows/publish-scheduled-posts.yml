name: Publish scheduled blog posts

# Publishes queued blog posts on their date, with no PC or app involved.
# Daily cron checks _scheduled/manifest.json; any post whose publish_date has
# arrived is moved into /Blog/ and committed. The push makes Vercel redeploy,
# so the post goes live on its own. Posts already published are skipped.

on:
  schedule:
    - cron: "7 13 * * *"   # 13:07 UTC = ~9:07am US Eastern (EDT). Runs daily.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List posts that are due, without publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish any due posts
        run: python _scheduled/publish_due.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit and push if anything published
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-publish scheduled blog post(s)"
            git push
            echo "Published and pushed."
          else
            echo "No posts due today; nothing to commit."
          fi
