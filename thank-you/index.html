    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

    </script>
    <!-- GA4: phone-call click tracking (sibling listener; does not touch the OpenAI Ads tel listener) -->
    <script>document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="tel:"]');if(a&&typeof gtag==='function'){gtag('event','phone_call',{phone_number:a.getAttribute('href').slice(4),link_text:(a.textContent||'').trim().slice(0,80),page_location:location.href});}},true);</script>
    <meta charset="UTF-8">

    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E2C97E;
            --gold-dark: #A07830;
            --charcoal: #1A1A1A;
            --charcoal-mid: #252525;
            --charcoal-light: #2E2E2E;
            --off-white: #F5F2EC;
            --text-muted: #9A9A8A;
            --text-light: #CCCCBB;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Jost', sans-serif;
            background: var(--charcoal);
            color: var(--off-white);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            line-height: 1.15;
        }

        .gold { color: var(--gold); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 620px;
            text-align: center;
            background: var(--charcoal-mid);
            border: 1px solid rgba(201, 168, 76, 0.25);
            border-radius: 18px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .check {
            width: 68px;
            height: 68px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check svg { width: 34px; height: 34px; stroke: var(--charcoal); stroke-width: 3; fill: none; }

        h1 {
            font-size: clamp(1.9rem, 5vw, 2.9rem);
            margin-bottom: 1rem;
        }

        .subcopy {
            color: var(--text-light);
            font-size: 1.1rem;
            max-width: 480px;
            margin: 0 auto 2rem;
        }

        .call-btn {
            display: block;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            background: var(--gold);
            color: var(--charcoal);
            font-family: 'Jost', sans-serif;
            font-weight: 600;
            font-size: 1.35rem;
            text-decoration: none;
            padding: 1.15rem 1.5rem;
            border-radius: 12px;
            letter-spacing: 0.3px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .call-btn:hover, .call-btn:active { background: var(--gold-light); transform: translateY(-2px); }

        .call-btn small {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.75;
            margin-bottom: 0.15rem;
        }

        .trust {
            margin-top: 1.75rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .trust .stars { color: var(--gold); letter-spacing: 1px; }

        .back-link {
            display: inline-block;
            margin-top: 1.75rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(154, 154, 138, 0.4);
            padding-bottom: 1px;
        }

        .back-link:hover { color: var(--gold); border-color: var(--gold); }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 480px) {
            .card { padding: 2.25rem 1.35rem; }
            .call-btn { font-size: 1.2rem; }
        }
    </style>
  <!-- OpenAI Ads Measurement Pixel -->
  <script>
    window.oaiq = window.oaiq || function () { (window.oaiq.q = window.oaiq.q || []).push(arguments); };
    oaiq("init", { pixelId: "1F5g6WgWCyxiUeo7YqJkgL" });
  </script>
  <script async src="https://bzrcdn.openai.com/sdk/oaiq.min.js"></script>
  <!-- OpenAI Ads: phone-call lead conversion (any tel: click, once per session) -->
  <script>
    document.addEventListener("click", function (ev) {
      try {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="tel:"]') : null;
        if (!a || sessionStorage.getItem("oaiq_call_fired")) return;
        var eid = "call_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
        oaiq("measure", "lead_created", { type: "customer_action" }, { event_id: eid });
        sessionStorage.setItem("oaiq_call_fired", "1");
      } catch (e) {}
    }, true);
  </script>
  <!-- OpenAI Ads: lead conversion (fires once per session; mirrors GA4 generate_lead) -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("oaiq_lead_fired")) return;
        var eid = "lead_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
        oaiq("measure", "lead_created", { type: "customer_action" }, { event_id: eid });
        sessionStorage.setItem("oaiq_lead_fired", "1");
      } catch (e) {}
    })();
  </script>
</head>

                Call (603) 759-8547 Now
            </a>

            <div class="trust">
                <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
                <span>5.0 rating from 19 Google reviews</span>
            </div>

            <a class="back-link" href="/">Back to Shea Business Solutions</a>
        </div>
    </main>

        &copy; Shea Business Solutions Bookkeeping &amp; Tax &middot; Orlando, FL
    </footer>
