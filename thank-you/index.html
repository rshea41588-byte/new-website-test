  <script async src="https://bzrcdn.openai.com/sdk/oaiq.min.js"></script>
  <!-- OpenAI Ads conversions v2 (Bloomview 2026-08-25): lead_created = form leads | appointment_scheduled = Calendly CTA click | phone_call = custom, tel: click -->
  <script>
  /* Bloomview first-touch attribution (2026-08-25). Ads land on one page and the visitor often
     submits on another, so the lead beacon was recording the SUBMIT page - an ad lead read as
     organic. Stash the first page of the session once; bvgFT() flattens it onto every lead. */
  (function () {
    try {
      if (!sessionStorage.getItem("bvg_ft")) {
        var q = new URLSearchParams(location.search);
        var ft = { landing: (location.pathname + location.search).slice(0, 200), ref: (document.referrer || "").slice(0, 200) };
        ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid","oppref"].forEach(function (k) {
          var v = q.get(k); if (v) ft[k] = v.slice(0, 120);
        });
        sessionStorage.setItem("bvg_ft", JSON.stringify(ft));
      }
    } catch (e) {}
  })();
  window.bvgFT = function () {
    try {
      var raw = sessionStorage.getItem("bvg_ft"); if (!raw) return "";
      var f = JSON.parse(raw), out = [];
      if (f.landing) out.push("landing=" + f.landing);
      if (f.ref) out.push("ref=" + f.ref);
      ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid","oppref"].forEach(function (k) {
        if (f[k]) out.push(k + "=" + f[k]);
      });
      return out.join(" | ");
    } catch (e) { return ""; }
  };
  (function () {
    if (!/(^|\.)sheabusinesssolutions\.com$/.test(location.hostname)) return;
    if (window.__bvgOaiq2) return; window.__bvgOaiq2 = true;
    function eid(p) { return p + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10); }
    function once(k) { try { if (sessionStorage.getItem(k)) return false; sessionStorage.setItem(k, "1"); return true; } catch (e) { return true; } }
    function fire(n, d, o) { try { oaiq("measure", n, d, o); } catch (e) {} }

    /* phone_call - CUSTOM event. Was reported as lead_created until 2026-08-25; split so that
       lead_created means form leads only. Dylan's call. */
    document.addEventListener("click", function (ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href^="tel:"]') : null;
      if (!a || !once("oaiq_call_fired")) return;
      fire("custom", { type: "custom" }, { custom_event_name: "phone_call", event_id: eid("call") });
    }, true);

    /* appointment_scheduled - fires on the Calendly CTA CLICK.
       WARNING: counts booking INTENT, not a completed booking. The booking completes on
       calendly.com, where this pixel does not run. Dylan's explicit call, 2026-08-25. */
    document.addEventListener("click", function (ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href*="calendly.com"]') : null;
      if (!a || !once("oaiq_appt_fired")) return;
      fire("appointment_scheduled", { type: "customer_action" }, { event_id: eid("appt") });
    }, true);

    /* lead_created - real form leads. Two success paths exist on this site:
       (a) redirect pages (home, services...): web3forms redirects to /thank-you/ and the submit
           handler leaves bvg_lead_pending in sessionStorage. This block runs in <head>, so it
           reads that stash BEFORE the body script on /thank-you/ removes it. It never removes it.
           Gating on the stash means a refresh or direct visit to /thank-you/ is NOT counted.
       (b) inline pages (city/money pages): the existing handler un-hides .hero-form-success. */
    function lead() { if (once("oaiq_lead_fired")) fire("lead_created", { type: "customer_action" }, { event_id: eid("lead") }); }
    try {
      if (/\/thank-you(\/|\/index\.html)?$/.test(location.pathname) && sessionStorage.getItem("bvg_lead_pending")) lead();
    } catch (e) {}
    function wireInline() {
      var s = document.querySelector(".hero-form-success");
      if (!s) return;
      new MutationObserver(function () { if (!s.hidden) lead(); }).observe(s, { attributes: true, attributeFilter: ["hidden"] });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wireInline);
    else wireInline();
  })();
  </script>

    <!-- Bloomview: first-party lead-log beacon. Sibling block - the GA4 generate_lead call
         above is untouched. Drains the snapshot the homepage stashed at submit time; reaching
         this page is the success signal, and the key is cleared so one lead is never sent twice. -->
    <script>

            var raw = sessionStorage.getItem('bvg_lead_pending');

            sessionStorage.removeItem('bvg_lead_pending');
            navigator.sendBeacon('/api/lead-log',
                new Blob([raw], { type: 'text/plain;charset=UTF-8' }));
        } catch (e) {}
    })();
